<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Stats Overlay</title>
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
    
    <!-- External Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

    <div class="overlay-container">
        <!-- Top Stats Section -->
        <div class="stats-row">
            <div class="stat-group">
                <span class="label">Rank</span>
                <span id="rank" class="value rank-text">---</span>
            </div>
            <div class="stat-group">
                <span class="label">Season W/L</span>
                <span id="season-wl" class="value">---</span>
            </div>
            <div class="stat-group">
                <span class="label">Win Rate</span>
                <span id="win-rate" class="value">---</span>
            </div>
            <div class="stat-group">
                <span class="label">Daily</span>
                <span id="daily-wl" class="value">---</span>
            </div>
            <div class="stat-group">
                <span class="label">MVPs</span>
                <span id="mvps" class="value">---</span>
            </div>
        </div>

        <!-- Match History (Hero Icons) Section -->
        <div id="match-history" class="history-row">
            <!-- Icons will be injected here by script.js -->
        </div>
    </div>

    <!-- JS Link -->
    <script src="script.js"></script>
</body>
</html>
